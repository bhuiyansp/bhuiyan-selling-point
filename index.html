<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhuiyan Selling Point</title>

<style>
html { scroll-behavior: smooth; }
body { margin:0; font-family:Segoe UI, sans-serif; background:#f5f5f5; }

/* Cover Image */
.cover-img {
  width:100%;
  height:auto;
  max-height:450px;  /* একটু বড় height */
  display:block;
  object-fit:cover;
}

/* Header / Logo */
header {
  background: linear-gradient(45deg,#ff6a00,#ff2e63);
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:flex-end; /* ডান পাশে */
  align-items:center;
}
.logo { display:flex; align-items:center; gap:10px; font-weight:bold; }
.logo img {
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
  transition: transform 0.3s ease;
}
.logo img:hover { transform: scale(1.1); }

/* Products Grid */
.products {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); /* width বড় করে দিচ্ছি */
  gap:20px;
  padding:20px;
}

/* Card & Animation */
.card {
  background:white;
  border-radius:12px;
  padding:10px;
  box-shadow:0 6px 15px rgba(0,0,0,0.1);
  text-align:center;
  transition: transform 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
  opacity:0;
  transform: translateY(20px);
  display:flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
}

/* Animate on scroll */
.card.show { opacity:1; transform: translateY(0); }

/* Advanced hover effect */
.card:hover { transform: scale(1.04); box-shadow:0 12px 25px rgba(0,0,0,0.2); }
.card img {
  width:100%;
  height:auto;
  max-height:300px; /* বড় height, sides crop হবে না */
  object-fit:contain;
  background:#f5f5f5;
  border-radius:10px;
  display:block;
  margin:0 auto;
  transition: transform 0.4s ease;
}
.card:hover img { transform: scale(1.05); }

h4 { font-size:16px; margin:8px 0 4px 0; }
.price { color:#ff2e63; font-weight:bold; margin:4px 0 8px 0; }

.order {
  background:#25D366;
  color:white;
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition: transform 0.3s ease, background 0.3s ease;
}
.order:hover { background:#1ebe5d; transform: scale(1.05); }

/* Responsive */
@media (max-width:480px){
  header { justify-content:center; text-align:center; }
  .logo { font-size:18px; flex-direction:column; }
  .logo img { width:60px; height:60px; }
  .card img { max-height:200px; } /* mobile adjust */
}
</style>
</head>

<body>

<!-- Cover -->
<img src="images/products/cover.png" alt="Cover" class="cover-img">

<!-- Header -->
<header>
  <div class="logo">
    <span>Bhuiyan Selling Point</span>
    <img src="images/products/logo.png" alt="Logo">
  </div>
</header>

<!-- Products -->
<div class="products" id="products"></div>

<script>
// OpenSheet ID
const sheetID = "1dM083XrSwtxced9puKJnBPSNVkIcYbLwD_JoEI1nySg";
const url = `https://opensheet.elk.sh/${sheetID}/Sheet1`;

fetch(url)
.then(res => res.json())
.then(data => displayProducts(data))
.catch(err => console.error("Error fetching products:", err));

function displayProducts(data){
  const container = document.getElementById("products");
  container.innerHTML = "";

  data.forEach(product => {
    const slug = product["Product Slug"];
    const name = product["Product Name"];
    const price = product["Price"];
    const imageURL = `images/products/${slug}-1.jpg`;

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${imageURL}" alt="${name}" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'">
      <h4>${name}</h4>
      <div class="price">৳${price}</div>
      <button class="order" onclick="buyNow('${name}', '${price}')">Order Now</button>
    `;
    container.appendChild(card);
  });

  // Animate cards on scroll
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add("show");
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.2 });

  document.querySelectorAll(".card").forEach(card => observer.observe(card));
}

function buyNow(name, price){
  const text = `I want to order ${name} - ৳${price}`;
  window.open(`https://wa.me/8801707192111?text=${encodeURIComponent(text)}`);
}
</script>

</body>
</html>
