<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhuiyan Selling Point</title>

<style>
body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#f4f6f9;
}

/* Cover */
.cover-img{
  width:100%;
  height:250px;
  object-fit:cover;
  margin-bottom:30px;
}
@media(max-width:480px){
  .cover-img{height:150px;}
}

/* Search */
.search-box{text-align:center;margin-bottom:20px;}
.search-box input{
  width:80%;
  max-width:400px;
  padding:12px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ccc;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* Grid */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  padding:0 20px 20px;
}

/* Card */
.card{
  background:white;
  border-radius:15px;
  padding:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  text-align:center;
  transition:0.4s;
  overflow:hidden;
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 15px 30px rgba(0,0,0,0.15);
}

/* Slider */
.product-slider{
  width:100%;
  height:300px;
  overflow:hidden;
  border-radius:12px;
  margin-bottom:10px;
  position:relative;
  background:#fff;
}
.product-slider img{
  width:100%;
  height:100%;
  object-fit:cover;
  position:absolute;
  top:0;left:0;
  opacity:0;
  transition:0.6s ease;
}
.product-slider img.active{opacity:1;}
.product-slider:hover img.active{
  transform:scale(1.05);
}

/* Text */
h4{font-size:18px;margin:8px 0;}
.price{
  color:#e60023;
  font-weight:bold;
  font-size:16px;
}

.order{
  background:#25D366;
  color:white;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:8px;
  transition:0.3s;
}
.order:hover{background:#1ebe5d;}

@media(max-width:480px){
  .product-slider{height:240px;}
}

/* Floating WhatsApp */
.whatsapp-float{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  padding:14px;
  border-radius:50%;
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
  animation:bounce 2s infinite;
}
.whatsapp-float img{width:28px;display:block;}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}

/* Footer */
footer{
  text-align:center;
  padding:20px;
  background:#111;
  color:white;
  margin-top:40px;
}

/* Popup */
.popup{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}
.popup-content{
  background:white;
  padding:20px;
  border-radius:12px;
  width:95%;
  max-width:420px;
  max-height:90vh;
  overflow-y:auto;
}
.popup-content input, .popup-content select{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:6px;
  border:1px solid #ccc;
}
.popup-content button{
  width:100%;
  padding:12px;
  background:#25D366;
  color:white;
  border:none;
  border-radius:8px;
}
.close-btn{text-align:right;cursor:pointer;font-weight:bold;}
.total-box{
  font-weight:bold;
  margin-bottom:10px;
  color:#e60023;
}
</style>
</head>
<body>

<img src="images/products/cover.png" class="cover-img">

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search product...">
</div>

<div class="products" id="products"></div>

<a href="https://wa.me/8801707192111" class="whatsapp-float" target="_blank">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</a>

<footer>© 2026 Bhuiyan Selling Point | All Rights Reserved</footer>

<!-- Popup -->
<div class="popup" id="orderPopup">
  <div class="popup-content">
    <div class="close-btn" onclick="closePopup()">X</div>

    <h3>🚚 Cash on Delivery Available</h3>

    <input type="text" id="customerName" placeholder="👤 নাম">
    <input type="text" id="customerPhone" placeholder="📱 মোবাইল নাম্বার">
    <input type="text" id="customerAddress" placeholder="🏠 সম্পূর্ণ ঠিকানা">

    <input type="number" id="quantity" value="1" min="1" oninput="calculateTotal()">

    <select id="area" onchange="calculateTotal()">
      <option value="70">ঢাকা (Delivery 70৳)</option>
      <option value="120">ঢাকার বাইরে (Delivery 120৳)</option>
    </select>

    <div class="total-box" id="totalAmount">মোট টাকা: ৳0</div>

    <button onclick="sendOrder()">Confirm Order</button>

    <p style="font-size:13px;">
      ⏱️ ডেলিভারি সময়: ৩ কার্যদিবস (ইনশাআল্লাহ)<br>
      ⚠️ সঠিক তথ্য দিলে অর্ডার দ্রুত কনফার্ম হবে।
    </p>
  </div>
</div>

<script>
const sheetID="1dM083XrSwtxced9puKJnBPSNVkIcYbLwD_JoEI1nySg";
const url=`https://opensheet.elk.sh/${sheetID}/Sheet1`;

let selectedProduct="";
let selectedPrice=0;

fetch(url)
.then(res=>res.json())
.then(data=>displayProducts(data));

function displayProducts(data){
  const container=document.getElementById("products");
  container.innerHTML="";

  data.forEach(product=>{
    const slug=product["Product Slug"];
    const name=product["Product Name"];
    const price=parseFloat(product["Price"]);

    const card=document.createElement("div");
    card.className="card";
    card.setAttribute("data-name", name.toLowerCase());

    card.innerHTML=`
      <div class="product-slider">
        <img src="images/products/${slug}-1.jpg" class="active">
        <img src="images/products/${slug}-2.jpg">
        <img src="images/products/${slug}-3.jpg">
      </div>
      <h4>${name}</h4>
      <div class="price">৳${price}</div>
      <button class="order" onclick="openPopup('${name}',${price})">Order Now</button>
    `;

    container.appendChild(card);
  });

  document.querySelectorAll(".product-slider").forEach(slider=>{
    const images=slider.querySelectorAll("img");
    let current=0;
    setInterval(()=>{
      images[current].classList.remove("active");
      current=(current+1)%images.length;
      images[current].classList.add("active");
    },2500);
  });
}

/* Search */
document.getElementById("searchInput").addEventListener("keyup",function(){
  const value=this.value.toLowerCase();
  document.querySelectorAll(".card").forEach(card=>{
    const name=card.getAttribute("data-name");
    card.style.display=name.includes(value)?"block":"none";
  });
});

/* Popup */
function openPopup(name,price){
  selectedProduct=name;
  selectedPrice=price;
  document.getElementById("orderPopup").style.display="flex";
  calculateTotal();
}
function closePopup(){
  document.getElementById("orderPopup").style.display="none";
}
function calculateTotal(){
  const qty=parseInt(document.getElementById("quantity").value)||1;
  const delivery=parseInt(document.getElementById("area").value);
  const total=(selectedPrice*qty)+delivery;
  document.getElementById("totalAmount").innerText="মোট টাকা: ৳"+total;
}
function sendOrder(){
  const name=document.getElementById("customerName").value;
  const phone=document.getElementById("customerPhone").value;
  const address=document.getElementById("customerAddress").value;
  const qty=document.getElementById("quantity").value;
  const delivery=parseInt(document.getElementById("area").value);
  const total=(selectedPrice*qty)+delivery;

  alert("✅ আপনার অর্ডার প্রস্তুত! এখন WhatsApp এ কনফার্ম করুন.");

  const message=`🚚 Cash on Delivery Available 🚚
Product: ${selectedProduct}
Quantity: ${qty}
Total: ৳${total}

Name: ${name}
Phone: ${phone}
Address: ${address}`;

  window.open(`https://wa.me/8801707192111?text=${encodeURIComponent(message)}`);
}
</script>

</body>
</html>
