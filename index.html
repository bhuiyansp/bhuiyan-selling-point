<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhuiyan Selling Point</title>

<style>
html {
  scroll-behavior: smooth; /* Smooth scroll */
}

body {
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:#f5f5f5;
}

/* Cover Image */
.header-cover {
  width: 100%;
  height: 360px;
  background-image: url('https://raw.githubusercontent.com/bhuiyansp/bhuiyan-selling-point/main/images/cover.png');
  background-size: cover;  
  background-position: center;
  transition: background 0.5s ease;
}

/* Header / Logo */
header {
  background: linear-gradient(45deg,#ff6a00,#ff2e63);
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
}

.logo {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:bold;
}

.logo img {
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.logo img:hover {
  transform: scale(1.1);
}

/* Products Grid */
.products {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:18px;
  padding:20px;
}

.card {
  background:white;
  border-radius:12px;
  padding:10px;
  box-shadow:0 6px 15px rgba(0,0,0,0.1);
  text-align:center;
  transition: transform 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
  opacity:0;
  transform: translateY(20px);
}

.card.show {
  opacity:1;
  transform: translateY(0);
}

.card:hover {
  transform:translateY(-6px);
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.card img {
  width:100%;
  height:220px;
  object-fit: cover;
  border-radius:10px;
  background:#f5f5f5;
}

h4 {
  font-size:16px;
  margin:8px 0 4px 0;
}

.price {
  color:#ff2e63;
  font-weight:bold;
  margin:4px 0 8px 0;
}

.order {
  background:#25D366;
  color:white;
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition:0.2s;
}

.order:hover {
  background:#1ebe5d;
}

/* Responsive */
@media (max-width:480px){
  header{
    justify-content:center;
    text-align:center;
  }
  .logo{
    font-size:18px;
    flex-direction:column;
  }
  .logo img{
    width:60px;
    height:60px;
  }
  .card img{
    height:160px;
  }
}
</style>
</head>

<body>

<!-- Cover -->
<div class="header-cover"></div>

<!-- Header -->
<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/bhuiyansp/bhuiyan-selling-point/main/images/products/logo.png" alt="Logo">
    Bhuiyan Selling Point
  </div>
</header>

<!-- Products -->
<div class="products" id="products"></div>

<script>
// OpenSheet ID
const sheetID = "1dM083XrSwtxced9puKJnBPSNVkIcYbLwD_JoEI1nySg";
const url = `https://opensheet.elk.sh/${sheetID}/Sheet1`;

fetch(url)
.then(res => res.json())
.then(data => displayProducts(data))
.catch(err => console.error("Error fetching products:", err));

function displayProducts(data){
  const container = document.getElementById("products");
  container.innerHTML = "";

  data.forEach(product => {
    const slug = product["Product Slug"];
    const name = product["Product Name"];
    const price = product["Price"];

    const imageURL = `https://raw.githubusercontent.com/bhuiyansp/bhuiyan-selling-point/main/images/products/${slug}-1.jpg`;

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${imageURL}" alt="${name}" onerror="this.src='https://via.placeholder.com/220x220?text=No+Image'">
      <h4>${name}</h4>
      <div class="price">৳${price}</div>
      <button class="order" onclick="buyNow('${name}', '${price}')">Order Now</button>
    `;
    container.appendChild(card);
  });

  // Animate cards on scroll
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add("show");
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.2 });

  document.querySelectorAll(".card").forEach(card => observer.observe(card));
}

function buyNow(name, price){
  const text = `I want to order ${name} - ৳${price}`;
  window.open(`https://wa.me/8801707192111?text=${encodeURIComponent(text)}`);
}
</script>

</body>
</html>
