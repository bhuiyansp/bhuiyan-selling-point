<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhuiyan Selling Point</title>

<style>
body { margin:0; font-family:Segoe UI, sans-serif; background:#f5f5f5; }

/* Cover Image */
.cover-img {
  width: 100%;
  height: 250px;      /* desktop */
  object-fit: cover;
  display: block;
  margin-bottom: 30px; /* cover এবং products-এর মধ্যে ফাঁকা space */
}

@media (max-width:480px){
  .cover-img {
    height: 150px;    /* mobile height */
    margin-bottom: 30px; /* mobile view-এও 30px space */
  }
}

/* Products Grid */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap: 20px;
  padding: 0 20px 20px 20px;
}

/* Card & hover */
.card {
  background:white;
  border-radius:12px;
  padding:10px;
  box-shadow:0 6px 15px rgba(0,0,0,0.1);
  text-align:center;
  transition: transform 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
  opacity:0;
  transform: translateY(20px);
  display:flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
}

.card.show { opacity:1; transform: translateY(0); }
.card:hover { transform: scale(1.04); box-shadow:0 12px 25px rgba(0,0,0,0.2); }

/* Slider container */
.product-slider {
  position: relative;
  width: 100%;
  height: 400px; /* desktop image height */
  overflow: hidden;
  border-radius:10px;
  margin-bottom:10px;
}
.product-slider img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: absolute;
  top:0; left:0;
  opacity:0;
  transition: opacity 0.5s ease;
}
.product-slider img.active { opacity:1; }

/* Product info */
h4 { font-size:16px; margin:8px 0 4px 0; }
.price { color:#ff2e63; font-weight:bold; margin:4px 0 8px 0; }

.order {
  background:#25D366;
  color:white;
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition: transform 0.3s ease, background 0.3s ease;
}
.order:hover { background:#1ebe5d; transform: scale(1.05); }

/* Mobile responsive */
@media (max-width:480px){
  .product-slider { height: 350px; }
}
</style>
</head>
<body>

<!-- Cover -->
<img src="images/products/cover.png" alt="Cover" class="cover-img">

<!-- Products Grid -->
<div class="products" id="products"></div>

<script>
// OpenSheet ID
const sheetID = "1dM083XrSwtxced9puKJnBPSNVkIcYbLwD_JoEI1nySg";
const url = `https://opensheet.elk.sh/${sheetID}/Sheet1`;

fetch(url)
.then(res => res.json())
.then(data => displayProducts(data))
.catch(err => console.error("Error fetching products:", err));

function displayProducts(data){
  const container = document.getElementById("products");
  container.innerHTML = "";

  data.forEach(product => {
    const slug = product["Product Slug"];
    const name = product["Product Name"];
    const price = product["Price"];

    // Product card
    const card = document.createElement("div");
    card.className = "card";

    // Slider HTML
    const sliderHTML = `
      <div class="product-slider">
        <img src="images/products/${slug}-1.jpg" class="active" alt="${name}" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'">
        <img src="images/products/${slug}-2.jpg" alt="${name}" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'">
        <img src="images/products/${slug}-3.jpg" alt="${name}" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'">
      </div>
    `;

    card.innerHTML = `
      ${sliderHTML}
      <h4>${name}</h4>
      <div class="price">৳${price}</div>
      <button class="order" onclick="buyNow('${name}', '${price}')">Order Now</button>
    `;
    container.appendChild(card);
  });

  // Animate cards on scroll
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add("show");
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.2 });
  document.querySelectorAll(".card").forEach(card => observer.observe(card));

  // Start slider for all products
  document.querySelectorAll(".product-slider").forEach(slider => {
    const images = slider.querySelectorAll("img");
    let current = 0;
    setInterval(() => {
      images[current].classList.remove("active");
      current = (current + 1) % images.length;
      images[current].classList.add("active");
    }, 2000); // 2 seconds per image
  });
}

function buyNow(name, price){
  const text = `I want to order ${name} - ৳${price}`;
  window.open(`https://wa.me/8801707192111?text=${encodeURIComponent(text)}`);
}
</script>

</body>
</html>
